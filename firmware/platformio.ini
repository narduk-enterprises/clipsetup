; Builds the C3 starter example and runs the host tests for the library's link helpers.
[platformio]
src_dir = ClipSetup/examples/C3Starter
test_dir = ClipSetup/test

[env]
lib_deps = symlink://ClipSetup

; ESP32-C3 SuperMini: 4MB flash, native USB, blue LED on GPIO8, BOOT on GPIO9.
[env:c3-starter]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
test_build_src = no
